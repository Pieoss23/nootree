services:
  postgres:
    image: postgres:16-alpine
    container_name: nootree-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nootree
      POSTGRES_PASSWORD: nootree
      POSTGRES_DB: nootree
    ports:
      - "5439:5432"
    volumes:
      - nootree-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nootree -d nootree"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nootree-postgres-data:
